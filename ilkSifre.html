<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ESTRAM EKYS | İlk Giriş</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="login-container">

    <img src="logo.png" class="login-logo">

    <h2>İlk Giriş</h2>

    <p class="login-text">
        Güvenliğiniz için ilk girişte şifrenizi değiştirmeniz gerekmektedir.
    </p>

    <input
        type="password"
        id="yeniSifre"
        placeholder="Yeni Şifre">

    <input
        type="password"
        id="yeniSifreTekrar"
        placeholder="Yeni Şifreyi Tekrar Giriniz">

    <button onclick="ilkSifreKaydet()">
        Şifreyi Güncelle
    </button>

</div>

<script src="personeller.js"></script>
<script src="script.js"></script>

</body>

</html>
