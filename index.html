<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESTRAM Kurumsal Yönetim Sistemi</title>

    <link rel="stylesheet" href="stil.css">
</head>

<body>

    <div class="login-page">

        <div class="login-container">

            <!-- Logo -->
            <img src="Estram.png" alt="ESTRAM Logo" class="logo">

            <h1>ESTRAM</h1>
            <h2>Kurumsal Yönetim Sistemi</h2>

            <!-- Kullanıcı Adı -->
            <input
                type="text"
                id="kullaniciAdi"
                placeholder="👤 Kullanıcı Adı">

            <!-- Şifre -->
            <input
                type="password"
                id="sifre"
                placeholder="🔒 Şifre">

            <!-- Giriş -->
            <button onclick="girisYap()">
                Giriş Yap
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
